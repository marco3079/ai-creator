name: Release da extensão VS Code

# Gatilho: criar uma tag vscode-vX.Y.Z (ex.: vscode-v0.2.0) ou rodar manualmente.
on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

jobs:
  build:
    name: Gerar .vsix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm ci
      - name: Compilar
        run: npm run compile
      - name: Gerar .vsix
        run: npx vsce package --no-dependencies -o ai-creator.vsix
      - name: Guardar o .vsix
        uses: actions/upload-artifact@v4
        with:
          name: ai-creator-vsix
          path: extensions/vscode/ai-creator.vsix
          if-no-files-found: error

  release:
    name: Criar Release no GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ai-creator-vsix
          path: dist
      - name: Criar ou atualizar a Release com o .vsix
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-creator.vsix
          generate_release_notes: true

  marketplace:
    name: Publicar no Marketplace
    needs: build
    # Só publica a partir de uma tag de versão (evita publicar por engano numa execução manual em branch).
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Verificar se há token do Marketplace
        id: token
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            echo "VSCE_PAT não configurado; publicação no Marketplace pulada."
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.tem == 'sim'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.tem == 'sim'
        with:
          node-version: 20
      - name: Instalar dependências
        if: steps.token.outputs.tem == 'sim'
        working-directory: extensions/vscode
        run: npm ci
      - name: Compilar
        if: steps.token.outputs.tem == 'sim'
        working-directory: extensions/vscode
        run: npm run compile
      - name: Publicar
        if: steps.token.outputs.tem == 'sim'
        working-directory: extensions/vscode
        run: npx vsce publish -p "$VSCE_PAT" --no-dependencies
