# Broker MQTT do AI Creator (frota de placas ESP32).
# O login é obrigatório: o usuário e a senha vêm do .env (MQTT_USUARIO / MQTT_SENHA)
# e o arquivo de senhas é gerado pelo entrypoint.sh na subida do contêiner.

listener 1883
allow_anonymous false
password_file /mosquitto/config/senhas

# Persistência das mensagens retidas (status das placas) e das sessões
persistence true
persistence_location /mosquitto/data/

# Logs no stdout (docker compose logs mosquitto)
log_dest stdout
